<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MBL News — Week 4 Thumb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Inter:wght@500;600&display=swap');

  :root {
    --navy-dark: #10202c;
    --teal: #2a9d8f;
    --gold: #f4c542;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* FIXED DESIGN CANVAS — 1280x720 (16:9). Intentionally simple: just
     one hero stat, nothing else. This is the THUMBNAIL version, meant
     to still read clearly even scaled down small on a list page. The
     full multi-panel breakdown lives in the separate detail-page
     graphic instead. */
  .canvas {
    width: 1280px;
    height: 720px;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1c3347 0%, var(--navy-dark) 100%);
    color: #eef4f8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 50px;
  }

  .portrait {
    flex: 0 0 auto;
    width: 260px;
    aspect-ratio: 400 / 377;
    height: auto;
    object-fit: contain;
    transform: translateY(20.6%);
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.45));
  }

  .text {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 20px;
  }

  .hero-number {
    font-family: 'Rubik', sans-serif;
    font-weight: 900;
    font-size: 110px;
    line-height: 1;
    color: var(--gold);
    margin: 0;
  }

  .hero-name {
    font-size: 30px;
    font-weight: 600;
    color: #ffffff;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="row">
      <img class="portrait" src="/players/Candy_Hammer.png" alt="Candy Hammer">
      <div class="text">
        <p class="eyebrow">Week 4 · Stat Leader, Losing Team</p>
        <p class="hero-number">#5 Overall</p>
        <p class="hero-name">Candy Hammer</p>
      </div>
    </div>
  </div>
</body>
</html>
