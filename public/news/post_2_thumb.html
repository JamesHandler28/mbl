<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Week 2 Thumb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Inter:wght@500;600&display=swap');
  
  :root { --navy-dark: #10202c; --teal: #2a9d8f; --gold: #f4c542; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .canvas {
    width: 1280px; height: 720px;
    font-family: 'Inter', sans-serif;
    color: #eef4f8;
    background: radial-gradient(circle at 50% 30%, #9ca3af33 0%, var(--navy-dark) 65%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px;
  }
  .eyebrow {
    font-size: 20px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin: 0 0 6px;
  }
  .title {
    font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 64px;
    color: #ffffff; margin: 0 0 28px; text-shadow: 0 0 30px #9ca3af88;
  }
  .lineup {
    display: flex; align-items: flex-end; gap: 14px;
  }
  .portrait {
    width: 160px; aspect-ratio: 400 / 377; height: auto; object-fit: contain;
    transform: translateY(20.6%);
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  }
  .subtitle {
    font-size: 20px; color: #cbd5e1; margin-top: 20px; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow">Week 2 · Biggest Fall</p>
    <p class="title">2-0 → 2-2</p>
    <div class="lineup">
      <img class="portrait" src="/players/Galactic_Sword.png" alt="">
      <img class="portrait" src="/players/Melony_Smasher.png" alt="">
      <img class="portrait" src="/players/Golden_Razor.png" alt="">
      <img class="portrait" src="/players/Frozen_Khopesh.png" alt="">
    </div>
    <p class="subtitle">Black's perfect start didn't survive the week</p>
  </div>
</body>
</html>
